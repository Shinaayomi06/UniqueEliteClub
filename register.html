

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#123c2b">
  <title>Membership Registration | Unique Elite Club</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px 14px;
      font-family: Arial, sans-serif;
      background: #f5f1e7;
      color: #183b2b;
    }
    main {
      max-width: 560px;
      margin: 20px auto;
      padding: 25px;
      background: white;
      border-radius: 16px;
      border-top: 6px solid #c7a54b;
      box-shadow: 0 8px 28px #173c2b18;
    }
    h1 { margin-bottom: 8px; }
    .gold { color: #a27b21; font-weight: bold; }
    label {
      display: block;
      margin-top: 16px;
      font-weight: bold;
    }
    input, textarea {
      width: 100%;
      margin-top: 7px;
      padding: 12px;
      border: 1px solid #c8d2ca;
      border-radius: 8px;
      font: inherit;
    }
    button {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: 0;
      border-radius: 8px;
      background: #174b35;
      color: white;
      font-size: 16px;
      font-weight: bold;
    }
    button:disabled { opacity: .6; }
    #message { margin-top: 18px; line-height: 1.5; }
    a { color: #174b35; }
  </style>
</head>
<body>
<main>
  <p class="gold">UNIQUE ELITE CLUB</p>
  <h1>Membership Registration</h1>
  <p>Apply to join our club. All applications require administrative approval and physical recognition at a club meeting.</p>

  <form id="registrationForm">
    <label for="full_name">Full name *</label>
    <input id="full_name" name="full_name" required maxlength="120" autocomplete="name">

    <label for="phone">Phone number *</label>
    <input id="phone" name="phone" type="tel" required maxlength="30" autocomplete="tel">

    <label for="email">Email address *</label>
    <input id="email" name="email" type="email" required maxlength="254" autocomplete="email">

    <label for="occupation">Occupation</label>
    <input id="occupation" name="occupation" maxlength="120">

    <label for="address">Area of residence</label>
    <input id="address" name="address" maxlength="200" autocomplete="address-level2">

    <label for="reason">Why do you want to join?</label>
    <textarea id="reason" name="reason" rows="3" maxlength="1000"></textarea>

    <button id="submitButton" type="submit">Submit Application</button>
  </form>

  <p id="message" role="status" aria-live="polite"></p>
  <p><a href="./index.html">Return to homepage</a></p>
</main>

<script src="./config.js"></script>
<script>
const form = document.getElementById("registrationForm");
const button = document.getElementById("submitButton");
const message = document.getElementById("message");

form.addEventListener("submit", async function(event) {
  event.preventDefault();

  if (typeof SUPABASE_URL === "undefined" ||
      typeof SUPABASE_PUBLISHABLE_KEY === "undefined" ||
      SUPABASE_PUBLISHABLE_KEY.includes("PASTE_YOUR")) {
    message.textContent = "Website configuration is incomplete. Please contact the club administrator.";
    return;
  }

  button.disabled = true;
  message.textContent = "Submitting your application...";

  const data = Object.fromEntries(new FormData(form).entries());
  const payload = {
    full_name: data.full_name.trim(),
    phone: data.phone.trim(),
    email: data.email.trim(),
    occupation: data.occupation.trim() || null,
    address: data.address.trim() || null,
    reason_for_joining: data.reason.trim() || null,
    status: "pending"
  };

  try {
    const response = await fetch(
      SUPABASE_URL + "/rest/v1/membership_applications",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "apikey": SUPABASE_PUBLISHABLE_KEY,
          "Authorization": "Bearer " + SUPABASE_PUBLISHABLE_KEY,
          "Prefer": "return=minimal"
        },
        body: JSON.stringify(payload)
      }
    );

    if (!response.ok) {
      throw new Error("Application submission failed.");
    }

    form.reset();
    message.textContent = "Application submitted successfully! Your application is pending admin approval. Please attend a physical club meeting for recognition when invited.";
  } catch (error) {
    message.textContent = "We could not submit your application. Please try again later or contact the club administrator.";
  } finally {
    button.disabled = false;
  }
});
</script>
</body>
</html>
